<main class="split-screen">
  <!-- Left: form panel -->
  <section class="form-panel">
    <div class="form-panel-inner">
      <header class="login-header">
        <h1>Set a new password</h1>
        <p>Choose a new password for your account. You'll use it the next time you sign in.</p>
      </header>

      <form novalidate>
        <div class="form-group">
          <label for="password">New password</label>
          <input
            id="password"
            type="password"
            name="password"
            autocomplete="new-password"
            placeholder="At least 8 characters"
          />
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm new password</label>
          <input
            id="confirmPassword"
            type="password"
            name="confirmPassword"
            autocomplete="new-password"
            placeholder="Re-enter your password"
          />
        </div>

        <button class="login-button" type="submit">Reset password</button>
      </form>

      <div class="register-section">
        Changed your mind?
        <a href="/login">Back to sign in</a>
      </div>
    </div>
  </section>

  <!-- Right: illustrated panel -->
  <aside class="visual-panel" aria-hidden="true">
    <app-auth-showcase
      heading="One step from your pipeline."
      text="Set your new password and pick up right where you left off."
    />
  </aside>
</main>
