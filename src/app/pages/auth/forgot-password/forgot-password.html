<main class="split-screen">
  <!-- Left: form panel -->
  <section class="form-panel">
    <div class="form-panel-inner">
      <header class="login-header">
        <h1>Forgot your password?</h1>
        <p>Enter the email you registered with and we'll send you a link to reset it.</p>
      </header>

      <form novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input
            id="email"
            type="email"
            name="email"
            autocomplete="email"
            placeholder="you@example.com"
          />
        </div>

        <button class="login-button" type="submit">Send reset link</button>
      </form>

      <div class="register-section">
        Remembered your password?
        <a routerLink="/login">Back to sign in</a>
      </div>
    </div>
  </section>

  <!-- Right: illustrated panel -->
  <aside class="visual-panel" aria-hidden="true">
    <app-auth-showcase
      heading="Back to your pipeline in a minute."
      text="Every application you've tracked is right where you left it."
    />
  </aside>
</main>
