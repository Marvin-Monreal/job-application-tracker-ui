<aside class="visual-panel" aria-hidden="true">
  <div class="visual-copy">
    <h2>{{ heading() }}</h2>
    <p>{{ text() }}</p>
  </div>

  <div class="pipeline">
    <div class="pipeline-stage is-done">
      <span class="pipeline-dot"></span>
      <div class="pipeline-text">
        <div class="pipeline-role">Frontend Engineer</div>
        <div class="pipeline-company">Meridian Labs</div>
      </div>
      <span class="pipeline-stage-label">Applied</span>
    </div>

    <div class="pipeline-stage is-active">
      <span class="pipeline-dot"></span>
      <div class="pipeline-text">
        <div class="pipeline-role">Full-Stack Developer</div>
        <div class="pipeline-company">Northbridge Co.</div>
      </div>
      <span class="pipeline-stage-label">Interviewing</span>
    </div>

    <div class="pipeline-stage">
      <span class="pipeline-dot"></span>
      <div class="pipeline-text">
        <div class="pipeline-role">Software Engineer II</div>
        <div class="pipeline-company">Alderly Systems</div>
      </div>
      <span class="pipeline-stage-label">Offer</span>
    </div>
  </div>
</aside>
